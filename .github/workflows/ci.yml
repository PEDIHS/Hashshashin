name: CI

on:
  push:
    branches: [ main, 'dev/**', 'feat/**', 'perf/**' ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.18.x', '1.22.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Unit and transport integration tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./...
      - name: Installer syntax
        run: bash -n install.sh
      - name: Manager syntax
        run: bash -n packaging/hashshashin-manager.sh
      - name: Benchmark tool syntax
        if: hashFiles('tools/hsh-bench.sh') != ''
        run: bash -n tools/hsh-bench.sh
